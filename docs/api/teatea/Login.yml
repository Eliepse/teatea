info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost/auth/dev/:token
  params:
    - name: token
      value: "{{LOGIN_KEY}}"
      type: path
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.token
        method: jsonq
      variable:
        name: token
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.refresh_token_expiration
        method: jsonq
      variable:
        name: token_expiration
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
