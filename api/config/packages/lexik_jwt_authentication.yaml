lexik_jwt_authentication:
    secret_key: '%env(string:JWT_SECRET_KEY)%'
    public_key: '%env(string:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(string:JWT_PASSPHRASE)%'
    # Short TTL for security (we have a refresh token)
    token_ttl: 3600 # 60 min as seconds
    user_id_claim: email
    
    blocklist_token:
        enabled: true
        cache: cache.app
